[project]
name = "claw-backend"
version = "0.1.0"
description = "Claw Zero Token FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "websockets>=13.1",
    "python-multipart>=0.0.12",
    "cryptography>=43.0",
    "playwright>=1.47",
    "pyjwt>=2.9",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "anyio>=4.6",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
